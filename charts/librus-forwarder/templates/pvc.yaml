apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "librus-forwarder.fullname" . }}
  labels:
    {{- include "librus-forwarder.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
