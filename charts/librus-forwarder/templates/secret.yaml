{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "librus-forwarder.fullname" . }}
  labels:
    {{- include "librus-forwarder.labels" . | nindent 4 }}
type: Opaque
stringData:
  FETCH_SECRET: {{ .Values.secret.fetchSecret | quote }}
  LIBRUS_LOGIN: {{ .Values.secret.librusLogin | quote }}
  LIBRUS_PASSWORD: {{ .Values.secret.librusPassword | quote }}
  {{- if .Values.secret.slackWebhookUrl }}
  SLACK_WEBHOOK_URL: {{ .Values.secret.slackWebhookUrl | quote }}
  {{- end }}
{{- end }}
